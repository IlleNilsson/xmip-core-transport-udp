[package]
name = "xmip-core-transport-udp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-udp"
description = "UDP transport: one datagram is one Stream, no reply channel. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Transport trait, Arrived, Directions, the error
# vocabulary and the line-oriented wire helpers live there. Standard library
# otherwise, which is what lets this build on every target in
# deployment-model.md without a cross-compilation story. Its declaration
# takes the capability's `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# The one refusal of a size over a ceiling (`net::ceiling`), and an
# origin read back as a URI (`net::Target`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
